<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

        .badge { background-color: #2ecc71; color: white; padding: 6px 16px; border-radius: 20px; font-size: 14px; display: inline-block; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">موقعي الأول شغال 🌐</span>
        <h1>مرحباً بكم في موقعي الإلكتروني الحقيقي! 🎉</h1>
        <p>لقد نجحت في رفع وتشغيل هذا الموقع بنجاح مجاناً باستخدام GitHub و Vercel.</p>
    </div>
</body>
</html>
